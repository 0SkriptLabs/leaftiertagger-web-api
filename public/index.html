<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#212121;color:#ececec}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:flex;overflow:hidden}
.sidebar{width:260px;background:#171717;display:flex;flex-direction:column;padding:12px;flex-shrink:0}
.new{height:44px;border:1px solid #3a3a3a;background:#212121;color:#fff;border-radius:8px;text-align:left;padding:0 14px;font-size:14px;display:flex;align-items:center;gap:10px}
.new:hover{background:#2a2a2a}
.search{height:42px;margin-top:8px;border:0;background:transparent;color:#ddd;border-radius:8px;text-align:left;padding:0 12px;display:flex;align-items:center;gap:10px}
.search:hover{background:#2a2a2a}
.label{font-size:12px;color:#8e8e8e;padding:18px 12px 7px}
.history{overflow:auto;flex:1}
.chat{height:40px;border-radius:7px;padding:0 12px;display:flex;align-items:center;color:#cfcfcf;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat:hover,.chat.active{background:#2a2a2a;color:#fff}
.account{border-top:1px solid #2d2d2d;padding-top:10px;margin-top:8px}
.account button{width:100%;height:42px;border:0;background:transparent;color:#ddd;border-radius:8px;text-align:left;padding:0 12px}
.account button:hover{background:#2a2a2a}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#212121}
.top{height:60px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.05)}
.model{display:flex;align-items:center;gap:7px;font-weight:600;font-size:15px}
.chev{color:#9b9b9b;font-size:12px}
.spacer{flex:1}
.topbtn{width:36px;height:36px;border:0;background:transparent;color:#aaa;border-radius:8px;font-size:20px}
.topbtn:hover{background:#2d2d2d;color:#fff}
.viewport{flex:1;overflow:auto}
.messages{width:min(768px,calc(100% - 32px));margin:0 auto;padding:32px 0 180px}
.empty{min-height:calc(100vh - 280px);display:flex;align-items:center;justify-content:center;flex-direction:column}
.empty h1{font-size:30px;font-weight:600;margin:0 0 28px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(620px,100%)}
.suggestion{border:1px solid #3a3a3a;background:#252525;color:#ddd;border-radius:10px;padding:14px;text-align:left}
.suggestion:hover{background:#2c2c2c}
.msg{display:flex;gap:14px;margin:28px 0}
.msg.user{justify-content:flex-end}
.bubble{max-width:78%;padding:12px 15px;border-radius:18px;line-height:1.55;font-size:15px}
.user .bubble{background:#2f2f2f;color:#f1f1f1}
.ai .bubble{background:transparent;padding-left:0}
.avatar{width:28px;height:28px;border-radius:7px;background:#10a37f;display:grid;place-items:center;flex:none;color:#fff;font-size:13px;font-weight:700}
.composer-area{position:fixed;bottom:0;left:260px;right:0;background:linear-gradient(transparent,#212121 28%);padding:30px 20px 18px}
.composer{width:min(768px,100%);margin:auto;background:#2f2f2f;border:1px solid #4a4a4a;border-radius:15px;min-height:58px;display:flex;align-items:flex-end;padding:8px 9px 8px 14px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
textarea{flex:1;resize:none;outline:0;border:0;background:transparent;color:#fff;max-height:180px;min-height:38px;padding:9px 4px;font-size:15px;line-height:1.45}
textarea::placeholder{color:#8e8e8e}
.send{width:38px;height:38px;border:0;border-radius:9px;background:#fff;color:#111;display:grid;place-items:center;margin-left:8px;font-size:18px}
.send:disabled{background:#676767;color:#2b2b2b}
.tools{display:flex;align-items:center;gap:4px}
.tool{height:34px;border:0;background:transparent;color:#aaa;border-radius:8px;padding:0 8px;font-size:18px}
.tool:hover{background:#444;color:#fff}
.disclaimer{text-align:center;color:#777;font-size:11px;margin-top:8px}
@media(max-width:760px){.sidebar{display:none}.composer-area{left:0}.messages{width:calc(100% - 24px)}.suggestions{grid-template-columns:1fr}.empty h1{font-size:26px}.top{padding:0 14px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<button class="new" id="newChat"><span>＋</span><span>New chat</span></button>
<button class="search" id="searchBtn"><span>⌕</span><span>Search chats</span></button>
<div class="label">Chats</div>
<div class="history" id="history">
<div class="chat active">New chat</div>
</div>
<div class="account"><button>⚙ Settings</button></div>
</aside>
<main class="main">
<header class="top"><div class="model">Chat <span class="chev">⌄</span></div><div class="spacer"></div><button class="topbtn">⋯</button></header>
<div class="viewport" id="viewport">
<section class="messages" id="messages">
<div class="empty" id="empty">
<h1>What can I help with?</h1>
<div class="suggestions">
<button class="suggestion">Explain something clearly</button>
<button class="suggestion">Help me write something</button>
<button class="suggestion">Help me with code</button>
<button class="suggestion">Brainstorm ideas</button>
</div>
</div>
</section>
</div>
<div class="composer-area">
<form class="composer" id="composer">
<div class="tools"><button type="button" class="tool">＋</button></div>
<textarea id="input" rows="1" placeholder="Message..."></textarea>
<button class="send" id="send" type="submit" disabled>↑</button>
</form>
<div class="disclaimer">AI chat interface</div>
</div>
</main>
</div>
<script>
const input=document.getElementById("input");
const send=document.getElementById("send");
const messages=document.getElementById("messages");
const empty=document.getElementById("empty");
const history=document.getElementById("history");
let count=0;
function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,180)+"px";send.disabled=!input.value.trim()}
input.addEventListener("input",resize);
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("composer").requestSubmit()}});
document.querySelectorAll(".suggestion").forEach(b=>b.addEventListener("click",()=>{input.value=b.textContent;resize();input.focus()}));
function addMessage(text,type){
if(empty) empty.remove();
const row=document.createElement("div");row.className="msg "+type;
if(type==="ai"){const av=document.createElement("div");av.className="avatar";av.textContent="C";row.appendChild(av)}
const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;row.appendChild(bubble);
messages.appendChild(row);document.getElementById("viewport").scrollTop=document.getElementById("viewport").scrollHeight;
}
function newChat(){
messages.innerHTML='<div class="empty" id="empty"><h1>What can I help with?</h1><div class="suggestions"><button class="suggestion">Explain something clearly</button><button class="suggestion">Help me write something</button><button class="suggestion">Help me with code</button><button class="suggestion">Brainstorm ideas</button></div></div>';
document.querySelectorAll(".suggestion").forEach(b=>b.addEventListener("click",()=>{input.value=b.textContent;resize();input.focus()}));
document.querySelectorAll(".chat").forEach(x=>x.classList.remove("active"));
const item=document.createElement("div");item.className="chat active";item.textContent="New chat";history.prepend(item);
input.value="";resize();input.focus();
}
document.getElementById("newChat").onclick=newChat;
document.getElementById("composer").addEventListener("submit",e=>{
e.preventDefault();const text=input.value.trim();if(!text)return;
addMessage(text,"user");count++;
const title=text.length>34?text.slice(0,34)+"…":text;
if(count===1){const item=document.querySelector(".chat.active");if(item)item.textContent=title}
input.value="";resize();
});
resize();
</script>
</body>
</html>
