<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeafTiers</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1a1a2e 0%, #0d0d1a 50%, #05050f 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e0e0e0;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(100, 80, 200, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(60, 100, 200, 0.06) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== FALLING LEAVES ===== */
    .leaves-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      top: -60px;
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, #4ade80, #22c55e);
      border-radius: 0 80% 0 80%;
      opacity: 0.75;
      animation: fall linear infinite;
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.4);
    }

    .leaf::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.25) 50%, transparent 60%);
      border-radius: 0 80% 0 80%;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0);
        opacity: 0.8;
      }
      25% {
        transform: translateY(25vh) rotate(90deg) translateX(15px);
      }
      50% {
        transform: translateY(50vh) rotate(180deg) translateX(-10px);
        opacity: 0.7;
      }
      75% {
        transform: translateY(75vh) rotate(270deg) translateX(20px);
      }
      100% {
        transform: translateY(105vh) rotate(360deg) translateX(-5px);
        opacity: 0.3;
      }
    }

    /* different sizes & speeds */
    .leaf:nth-child(1)  { left: 5%;  animation-duration: 11s; animation-delay: 0s;   width: 16px; height: 16px; }
    .leaf:nth-child(2)  { left: 12%; animation-duration: 14s; animation-delay: 1.2s; width: 20px; height: 20px; }
    .leaf:nth-child(3)  { left: 20%; animation-duration: 10s; animation-delay: 0.5s; width: 14px; height: 14px; }
    .leaf:nth-child(4)  { left: 28%; animation-duration: 13s; animation-delay: 2.1s; width: 18px; height: 18px; }
    .leaf:nth-child(5)  { left: 35%; animation-duration: 12s; animation-delay: 0.8s; width: 22px; height: 22px; }
    .leaf:nth-child(6)  { left: 42%; animation-duration: 15s; animation-delay: 3s;   width: 15px; height: 15px; }
    .leaf:nth-child(7)  { left: 50%; animation-duration: 11s; animation-delay: 1.5s; width: 19px; height: 19px; }
    .leaf:nth-child(8)  { left: 58%; animation-duration: 13s; animation-delay: 0.3s; width: 17px; height: 17px; }
    .leaf:nth-child(9)  { left: 65%; animation-duration: 14s; animation-delay: 2.4s; width: 21px; height: 21px; }
    .leaf:nth-child(10) { left: 72%; animation-duration: 10s; animation-delay: 1.8s; width: 14px; height: 14px; }
    .leaf:nth-child(11) { left: 80%; animation-duration: 12s; animation-delay: 0.7s; width: 18px; height: 18px; }
    .leaf:nth-child(12) { left: 88%; animation-duration: 15s; animation-delay: 2.8s; width: 16px; height: 16px; }
    .leaf:nth-child(13) { left: 15%; animation-duration: 13s; animation-delay: 4s;   width: 20px; height: 20px; }
    .leaf:nth-child(14) { left: 45%; animation-duration: 11s; animation-delay: 3.5s; width: 15px; height: 15px; }
    .leaf:nth-child(15) { left: 75%; animation-duration: 14s; animation-delay: 1s;   width: 19px; height: 19px; }
    .leaf:nth-child(16) { left: 8%;  animation-duration: 12s; animation-delay: 5s;   width: 17px; height: 17px; }
    .leaf:nth-child(17) { left: 55%; animation-duration: 10s; animation-delay: 2.2s; width: 14px; height: 14px; }
    .leaf:nth-child(18) { left: 92%; animation-duration: 13s; animation-delay: 0.9s; width: 21px; height: 21px; }

    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(10, 10, 20, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .logo {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .nav-links {
      display: flex;
      gap: 32px;
    }

    .nav-links a {
      color: #a0a0b8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .container {
      position: relative;
      z-index: 5;
      max-width: 980px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background-color: #16213e;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      position: relative;
      z-index: 10;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .filter-btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-btn img {
      width: 18px;
      height: 18px;
    }

    .filter-btn:hover {
      background-color: #2563eb;
    }

    .filter-btn.active {
      background-color: #1d4ed8;
      color: white;
    }

    .secondary-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background-color: #00c6ff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 180px;
    }

    .search-wrapper::before {
      content: '🔍';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      opacity: 0.5;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background-color: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 10px;
      padding: 9px 16px 9px 40px;
      color: #eee;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      border-color: #5a8cff;
    }

    .server-ip {
      margin-left: auto;
      font-size: 0.88rem;
      color: #a0a0b8;
    }

    .server-ip span {
      color: #ffcc33;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .table-header {
      display: grid;
      grid-template-columns: 60px 1fr 220px 120px;
      padding: 12px 16px;
      background-color: #0f3460;
      border-radius: 12px 12px 0 0;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: #00ff88;
      text-transform: uppercase;
    }

    #player-list {
      display: flex;
      flex-direction: column;
    }

    .player-row {
      display: grid;
      grid-template-columns: 60px 1fr 220px 120px;
      align-items: center;
      padding: 18px 16px;
      background-color: rgba(255, 255, 255, 0.02);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s, opacity 0.2s;
      cursor: pointer;
    }

    .player-row:last-child {
      border-radius: 0 0 14px 14px;
    }

    .player-row:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .rank {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .rank-1 {
      color: #ffd700;
    }

    .rank-2 {
      color: #c0c0c0;
    }

    .rank-3 {
      color: #cd7f32;
    }

    .rank-other {
      color: #6b6b80;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: #1a1a2e;
      border: 2px solid rgba(255, 200, 80, 0.5);
      box-shadow: 0 0 15px rgba(255, 180, 50, 0.25);
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }

    .player-sub {
      font-size: 0.8rem;
      color: #8a8aa0;
      margin-top: 2px;
    }

    .tiers {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tier-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 0.82rem;
      color: #e0e0e0;
      width: fit-content;
    }

    .tier-badge .ht {
      font-weight: 700;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 5px;
      color: #fff;
    }

    .ht-ht1 {
      background: linear-gradient(135deg, #ff3b3b, #cc0000);
      box-shadow: 0 2px 8px rgba(255, 50, 50, 0.45);
    }

    .ht-ht2 {
      background: linear-gradient(135deg, #ff9a2e, #e67300);
      box-shadow: 0 2px 8px rgba(255, 140, 0, 0.4);
    }

    .ht-ht3 {
      background: linear-gradient(135deg, #ffd700, #e6b800);
      box-shadow: 0 2px 8px rgba(255, 200, 0, 0.4);
      color: #1a1a1a !important;
    }

    .ht-other {
      background: linear-gradient(135deg, #6b6b80, #4a4a5a);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .tier-badge .pts {
      color: #c0c0d0;
      font-weight: 500;
    }

    .total-points {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffcc33;
      text-align: right;
    }

    .no-results {
      padding: 40px 20px;
      text-align: center;
      color: #6a6a80;
      font-size: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 0 0 14px 14px;
    }

    /* Custom Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: linear-gradient(145deg, rgba(30, 30, 50, 0.95), rgba(20, 20, 40, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      max-width: 500px;
      width: 90%;
      padding: 32px;
      position: relative;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .modal-close:hover {
      background: rgba(255, 68, 68, 0.3);
    }
    .modal-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .modal-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid rgba(255, 200, 80, 0.6);
      box-shadow: 0 0 20px rgba(255, 180, 50, 0.3);
      overflow: hidden;
    }
    .modal-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .modal-player-info h3 {
      color: #fff;
      margin-bottom: 4px;
    }
    .modal-player-info .rank {
      color: #ffcc33;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .modal-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .stat-box .label {
      color: #8a8aa0;
      font-size: 0.8rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-box .value {
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
    }
    .stat-box .tier-value {
      font-size: 1.2rem;
    }
    .modal-emoji-section {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .modal-emoji-section h4 {
      color: #8a8aa0;
      font-size: 0.85rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .emoji-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .emoji-item {
      font-size: 1.8rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .emoji-item:hover {
      transform: scale(1.2);
    }
    .emoji-item img {
      width: 24px;
      height: 24px;
    }
    .modal-tiers {
      margin-bottom: 20px;
    }
    .modal-tiers h4 {
      color: #8a8aa0;
      font-size: 0.85rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .modal-tier-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .modal-tier-list .tier-badge {
      width: 100%;
      justify-content: space-between;
    }
    .gamemode-icon {
      width: 14px;
      height: 14px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <!-- Falling green leaves -->
  <div class="leaves-container">
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
  </div>

  <header>
    <div class="logo">LeafTiers</div>
    <nav class="nav-links">
      <a href="#">Rankings</a>
    </nav>
  </header>

  <!-- Player Modal -->
  <div class="modal-overlay" id="playerModal">
    <div class="modal">
      <button class="modal-close" onclick="closePlayerModal()">×</button>
      <div class="modal-header">
        <div class="modal-avatar">
          <img id="modalAvatar" src="" alt="Player Avatar">
        </div>
        <div class="modal-player-info">
          <h3 id="modalPlayerName">Player Name</h3>
          <div class="rank" id="modalRank">Rank #1</div>
        </div>
      </div>
      <div class="modal-stats">
        <div class="stat-box">
          <div class="label">Total Points</div>
          <div class="value" id="modalTotalPoints">0</div>
        </div>
        <div class="stat-box">
          <div class="label">Highest Tier</div>
          <div class="value tier-value" id="modalHighestTier">HT1</div>
        </div>
      </div>
      <div class="modal-tiers">
        <h4>All Tiers</h4>
        <div class="modal-tier-list" id="modalTierList"></div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="All">All</button>
        <button class="filter-btn" data-filter="Sword"><img src="/images/sword.png" alt="Sword"> Sword</button>
        <button class="filter-btn" data-filter="Axe"><img src="/images/axe.png" alt="Axe"> Axe</button>
        <button class="filter-btn" data-filter="Mace"><img src="/images/mace.png" alt="Mace"> Mace</button>
        <button class="filter-btn" data-filter="Vanilla"><img src="/images/vanilla.png" alt="Vanilla"> Vanilla</button>
        <button class="filter-btn" data-filter="UHC"><img src="/images/uhc.png" alt="UHC"> UHC</button>
        <button class="filter-btn" data-filter="Pot"><img src="/images/pot.png" alt="Pot"> Pot</button>
        <button class="filter-btn" data-filter="NethOP"><img src="/images/nethop.png" alt="NethOP"> NethOP</button>
        <button class="filter-btn" data-filter="SMP"><img src="/images/smp.png" alt="SMP"> SMP</button>
      </div>

      <div class="secondary-bar">
        <button class="tab-btn">Information</button>
        <div class="search-wrapper">
          <input type="text" class="search-input" id="mainSearch" placeholder="Search player...">
        </div>
        <div class="server-ip">
          SERVER IP <span>leaftiers.com</span>
        </div>
      </div>

      <div class="table-header">
        <span>#</span>
        <span>PLAYER</span>
        <span>TIERS</span>
        <span>TOTAL POINTS</span>
      </div>

      <div id="player-list"></div>
    </div>
  </div>

  <script>
    // Player data - will be loaded from API
    let players = [];

    let currentFilter = "All";
    let currentSearch = "";

    const playerList = document.getElementById("player-list");
    const mainSearch = document.getElementById("mainSearch");
    const filterButtons = document.querySelectorAll(".filter-btn");

    // Load players from API
    async function loadPlayersFromAPI() {
      try {
        const response = await fetch('/api/tiers');
        const data = await response.json();
        
        // Convert API data to player format
        players = [];
        
        if (data.players) {
          Object.keys(data.players).forEach(username => {
            const playerData = data.players[username];
            const gamemodes = playerData.gamemodes || {};
            
            // Calculate total points and find highest tier
            let totalPoints = 0;
            let highestTier = 'LT5';
            let categories = [];
            let tiers = [];
            
            Object.entries(gamemodes).forEach(([gamemode, tierData]) => {
              const points = tierData.points || 0;
              const tier = tierData.tier || 'LT5';
              
              totalPoints += points;
              categories.push(gamemode);
              tiers.push({
                label: tier,
                points: points,
                category: gamemode
              });
              
              // Update highest tier based on points (HT1 best, LT5 worst)
              const tierOrder = ['HT1', 'LT1', 'HT2', 'LT2', 'HT3', 'LT3', 'HT4', 'MT4', 'HT5', 'LT5'];
              const currentIndex = tierOrder.indexOf(highestTier);
              const newTierIndex = tierOrder.indexOf(tier);
              if (newTierIndex < currentIndex) {
                highestTier = tier;
              }
            });
            
            players.push({
              name: username,
              highest: highestTier,
              total: totalPoints,
              categories: categories,
              tiers: tiers,
              emojis: ["crystal", "helmet", "heart"]
            });
          });
        }
        
        renderPlayers();
      } catch (error) {
        console.error('Error loading players:', error);
        players = [];
        renderPlayers();
      }
    }

    function getGamemodeIcon(category) {
      const icons = {
        'Sword': '/images/sword.png',
        'Axe': '/images/axe.png',
        'Mace': '/images/mace.png',
        'Vanilla': '/images/vanilla.png',
        'UHC': '/images/uhc.png',
        'Pot': '/images/pot.png',
        'NethOP': '/images/nethop.png',
        'SMP': '/images/smp.png'
      };
      return icons[category] || '/images/sword.png';
    }

    function getRankClass(rank) {
      if (rank === 1) return "rank-1";
      if (rank === 2) return "rank-2";
      if (rank === 3) return "rank-3";
      return "rank-other";
    }

    function getTierClass(label) {
      const upper = label.toUpperCase();
      if (upper === "HT1") return "ht-ht1";
      if (upper === "HT2") return "ht-ht2";
      if (upper === "HT3") return "ht-ht3";
      return "ht-other";
    }

    function renderPlayers() {
      // Filter + Search
      let filtered = players.filter(player => {
        const matchesFilter = currentFilter === "All" || player.categories.includes(currentFilter);
        const matchesSearch = player.name.toLowerCase().includes(currentSearch.toLowerCase());
        return matchesFilter && matchesSearch;
      });

      // Sort by total points descending
      filtered.sort((a, b) => b.total - a.total);

      if (filtered.length === 0) {
        if (players.length === 0) {
          playerList.innerHTML = `<div class="no-results">No players have been tiered yet. Use the Discord bot to add players!</div>`;
        } else {
          playerList.innerHTML = `<div class="no-results">No players found</div>`;
        }
        return;
      }

      playerList.innerHTML = filtered.map((player, index) => {
        const rank = index + 1;
        const rankClass = getRankClass(rank);

        const tiersHtml = player.tiers.map(t => {
          const gamemodeIcon = getGamemodeIcon(t.category);
          return `
          <div class="tier-badge">
            <img class="gamemode-icon" src="${gamemodeIcon}" alt="${t.category}">
            <span class="ht ${getTierClass(t.label)}">${t.label}</span>
            <span class="pts">${t.points}pts</span>
          </div>
        `;
        }).join("");

        return `
          <div class="player-row" data-name="${player.name}" onclick="openPlayerModal('${player.name}', ${rank})">
            <div class="rank ${rankClass}">#${rank}</div>
            <div class="player-info">
              <div class="avatar">
                <img src="https://mc-heads.net/avatar/${player.name}/100" alt="${player.name}" onerror="this.src='https://mc-heads.net/avatar/steve/100'">
              </div>
              <div>
                <div class="player-name">${player.name}</div>
                <div class="player-sub">Highest: ${player.highest}</div>
              </div>
            </div>
            <div class="tiers">
              ${tiersHtml}
            </div>
            <div class="total-points">${player.total} pts</div>
          </div>
        `;
      }).join("");
    }

    // Filter buttons
    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderPlayers();
      });
    });

    // Search
    mainSearch.addEventListener("input", (e) => {
      currentSearch = e.target.value.trim();
      renderPlayers();
    });

    // Player Modal Functions
    function openPlayerModal(playerName, rank) {
      const player = players.find(p => p.name === playerName);
      if (!player) return;

      // Update modal content
      document.getElementById('modalAvatar').src = `https://mc-heads.net/avatar/${player.name}/200`;
      document.getElementById('modalPlayerName').textContent = player.name;
      document.getElementById('modalRank').textContent = `Rank #${rank}`;
      document.getElementById('modalTotalPoints').textContent = player.total;
      document.getElementById('modalHighestTier').textContent = player.highest;

      // Update tier list
      const tierList = document.getElementById('modalTierList');
      tierList.innerHTML = player.tiers.map(t => {
        const gamemodeIcon = getGamemodeIcon(t.category);
        return `
        <div class="tier-badge">
          <img class="gamemode-icon" src="${gamemodeIcon}" alt="${t.category}">
          <span class="ht ${getTierClass(t.label)}">${t.label}</span>
          <span class="pts">${t.points}pts</span>
          <span style="color: #8a8aa0; font-size: 0.75rem; margin-left: 8px;">${t.category}</span>
        </div>
      `;
      }).join('');

      // Show modal
      document.getElementById('playerModal').classList.add('active');
    }

    function closePlayerModal() {
      document.getElementById('playerModal').classList.remove('active');
    }

    // Close modal when clicking outside
    document.getElementById('playerModal').addEventListener('click', (e) => {
      if (e.target.id === 'playerModal') {
        closePlayerModal();
      }
    });

    // Close modal with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closePlayerModal();
      }
    });

    // WebSocket connection for real-time updates
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${wsProtocol}//${window.location.host}`);
    
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'update') {
        loadPlayersFromAPI();
      }
    };
    
    ws.onerror = (error) => {
      console.error('WebSocket error:', error);
    };
    
    ws.onclose = () => {
      console.log('WebSocket disconnected');
    };

    // Initial load from API
    loadPlayersFromAPI();
  </script>
</body>
</html>
