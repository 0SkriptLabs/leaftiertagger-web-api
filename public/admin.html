<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeafTiers Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1a1a2e 0%, #0d0d1a 50%, #05050f 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e0e0e0;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(100, 80, 200, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(60, 100, 200, 0.06) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== FALLING LEAVES ===== */
    .leaves-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      top: -60px;
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, #4ade80, #22c55e);
      border-radius: 0 80% 0 80%;
      opacity: 0.75;
      animation: fall linear infinite;
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.4);
    }

    .leaf::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.25) 50%, transparent 60%);
      border-radius: 0 80% 0 80%;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0);
        opacity: 0.8;
      }
      25% {
        transform: translateY(25vh) rotate(90deg) translateX(15px);
      }
      50% {
        transform: translateY(50vh) rotate(180deg) translateX(-10px);
        opacity: 0.7;
      }
      75% {
        transform: translateY(75vh) rotate(270deg) translateX(20px);
      }
      100% {
        transform: translateY(105vh) rotate(360deg) translateX(-5px);
        opacity: 0.3;
      }
    }

    .leaf:nth-child(1)  { left: 5%;  animation-duration: 11s; animation-delay: 0s;   width: 16px; height: 16px; }
    .leaf:nth-child(2)  { left: 12%; animation-duration: 14s; animation-delay: 1.2s; width: 20px; height: 20px; }
    .leaf:nth-child(3)  { left: 20%; animation-duration: 10s; animation-delay: 0.5s; width: 14px; height: 14px; }
    .leaf:nth-child(4)  { left: 28%; animation-duration: 13s; animation-delay: 2.1s; width: 18px; height: 18px; }
    .leaf:nth-child(5)  { left: 35%; animation-duration: 12s; animation-delay: 0.8s; width: 22px; height: 22px; }
    .leaf:nth-child(6)  { left: 42%; animation-duration: 15s; animation-delay: 3s;   width: 15px; height: 15px; }
    .leaf:nth-child(7)  { left: 50%; animation-duration: 11s; animation-delay: 1.5s; width: 19px; height: 19px; }
    .leaf:nth-child(8)  { left: 58%; animation-duration: 13s; animation-delay: 0.3s; width: 17px; height: 17px; }
    .leaf:nth-child(9)  { left: 65%; animation-duration: 14s; animation-delay: 2.4s; width: 21px; height: 21px; }
    .leaf:nth-child(10) { left: 72%; animation-duration: 10s; animation-delay: 1.8s; width: 14px; height: 14px; }
    .leaf:nth-child(11) { left: 80%; animation-duration: 12s; animation-delay: 0.7s; width: 18px; height: 18px; }
    .leaf:nth-child(12) { left: 88%; animation-duration: 15s; animation-delay: 2.8s; width: 16px; height: 16px; }
    .leaf:nth-child(13) { left: 15%; animation-duration: 13s; animation-delay: 4s;   width: 20px; height: 20px; }
    .leaf:nth-child(14) { left: 45%; animation-duration: 11s; animation-delay: 3.5s; width: 15px; height: 15px; }
    .leaf:nth-child(15) { left: 75%; animation-duration: 14s; animation-delay: 1s;   width: 19px; height: 19px; }
    .leaf:nth-child(16) { left: 8%;  animation-duration: 12s; animation-delay: 5s;   width: 17px; height: 17px; }
    .leaf:nth-child(17) { left: 55%; animation-duration: 10s; animation-delay: 2.2s; width: 14px; height: 14px; }
    .leaf:nth-child(18) { left: 92%; animation-duration: 13s; animation-delay: 0.9s; width: 21px; height: 21px; }

    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(10, 10, 20, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .logo {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 32px;
    }

    .nav-links a {
      color: #a0a0b8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .container {
      position: relative;
      z-index: 5;
      max-width: 980px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: linear-gradient(145deg, rgba(30, 30, 50, 0.75), rgba(20, 20, 40, 0.85));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px 32px 24px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .admin-header h2 {
      color: #00ff88;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #00ff88;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.25);
      color: #d0d0e0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: rgba(0, 255, 136, 0.4);
    }

    button {
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      border: none;
      color: #1a1a2e;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
    }

    .delete-btn {
      background: linear-gradient(135deg, #ff4444, #cc0000);
      color: white;
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    .delete-btn:hover {
      box-shadow: 0 4px 15px rgba(255, 68, 68, 0.3);
    }

    .refresh-btn {
      background: linear-gradient(135deg, #5a8cff, #7b5cff);
      color: white;
    }

    .refresh-btn:hover {
      box-shadow: 0 4px 15px rgba(90, 140, 255, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 24px;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    th {
      background: rgba(255, 255, 255, 0.03);
      color: #8a8aa0;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .tier-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 0.82rem;
      color: #e0e0e0;
      width: fit-content;
    }

    .tier-badge .ht {
      font-weight: 700;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 5px;
      color: #fff;
    }

    .ht-ht1 {
      background: linear-gradient(135deg, #ff3b3b, #cc0000);
      box-shadow: 0 2px 8px rgba(255, 50, 50, 0.45);
    }

    .ht-ht2 {
      background: linear-gradient(135deg, #ff9a2e, #e67300);
      box-shadow: 0 2px 8px rgba(255, 140, 0, 0.4);
    }

    .ht-ht3 {
      background: linear-gradient(135deg, #ffd700, #e6b800);
      box-shadow: 0 2px 8px rgba(255, 200, 0, 0.4);
      color: #1a1a1a !important;
    }

    .ht-other {
      background: linear-gradient(135deg, #6b6b80, #4a4a5a);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    /* Custom Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: linear-gradient(145deg, rgba(30, 30, 50, 0.95), rgba(20, 20, 40, 0.98));
      padding: 30px;
      border-radius: 15px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 2px solid #00ff88;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
    }
    .modal h3 {
      color: #00ff88;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .modal p {
      margin: 20px 0;
      color: #e0e0e0;
    }
    .modal button {
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      color: #1a1a2e;
      padding: 10px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      header {
        padding: 14px 16px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .admin-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      table {
        font-size: 0.85rem;
      }

      th, td {
        padding: 10px 8px;
      }
    }
  </style>
</head>
<body>
  <!-- Falling green leaves -->
  <div class="leaves-container">
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
  </div>

  <!-- Custom Modal -->
  <div class="modal-overlay" id="customModal">
    <div class="modal">
      <h3 id="modalTitle">Message</h3>
      <p id="modalMessage">Your message here</p>
      <button onclick="closeModal()">OK</button>
    </div>
  </div>

  <header>
    <div class="logo">LeafTiers Admin</div>
    <nav class="nav-links">
      <a href="index.html">Rankings</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <div class="admin-header">
        <h2>Add/Update Player Tier</h2>
        <button class="refresh-btn" onclick="loadTiers()">Refresh Data</button>
      </div>
      
      <form id="tierForm">
        <div class="form-group">
          <label for="username">Minecraft Username:</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label for="tier">Tier:</label>
          <select id="tier" required>
            <option value="LT5">LT5 (Low Tier 5)</option>
            <option value="LT4">LT4 (Low Tier 4)</option>
            <option value="LT3">LT3 (Low Tier 3)</option>
            <option value="LT2">LT2 (Low Tier 2)</option>
            <option value="LT1">LT1 (Low Tier 1)</option>
            <option value="MT5">MT5 (Mid Tier 5)</option>
            <option value="MT4">MT4 (Mid Tier 4)</option>
            <option value="MT3">MT3 (Mid Tier 3)</option>
            <option value="MT2">MT2 (Mid Tier 2)</option>
            <option value="MT1">MT1 (Mid Tier 1)</option>
            <option value="HT5">HT5 (High Tier 5)</option>
            <option value="HT4">HT4 (High Tier 4)</option>
            <option value="HT3">HT3 (High Tier 3)</option>
            <option value="HT2">HT2 (High Tier 2)</option>
            <option value="HT1">HT1 (High Tier 1)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="color">Color:</label>
          <select id="color">
            <option value="gold">Gold</option>
            <option value="diamond">Diamond</option>
            <option value="red">Red</option>
          </select>
        </div>
        <div class="form-group">
          <label for="displayName">Display Name:</label>
          <input type="text" id="displayName">
        </div>
        <button type="submit">Save Tier</button>
      </form>
    </div>

    <div class="card" style="margin-top: 24px;">
      <h2>Current Tiers</h2>
      <table id="tiersTable">
        <thead>
          <tr>
            <th>Username</th>
            <th>Tier</th>
            <th>Color</th>
            <th>Display Name</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tiersBody">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Custom Modal Functions
    function showModal(title, message) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').textContent = message;
      document.getElementById('customModal').classList.add('active');
    }
    
    function closeModal() {
      document.getElementById('customModal').classList.remove('active');
    }

    function getTierClass(label) {
      const upper = label.toUpperCase();
      if (upper === "HT1") return "ht-ht1";
      if (upper === "HT2") return "ht-ht2";
      if (upper === "HT3") return "ht-ht3";
      return "ht-other";
    }

    // Load tiers on page load
    loadTiers();
    
    // Form submission
    document.getElementById('tierForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const tier = document.getElementById('tier').value;
      const color = document.getElementById('color').value;
      const displayName = document.getElementById('displayName').value || username;
      
      try {
        const response = await fetch('/api/tiers', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, tier, color, displayName })
        });
        
        const result = await response.json();
        if (result.success) {
          showModal('Success', result.message);
          document.getElementById('tierForm').reset();
          loadTiers();
        } else {
          showModal('Error', result.error);
        }
      } catch (error) {
        showModal('Error', error.message);
      }
    });
    
    // Load and display tiers
    async function loadTiers() {
      try {
        const response = await fetch('/api/tiers');
        const data = await response.json();
        
        const tbody = document.getElementById('tiersBody');
        tbody.innerHTML = '';
        
        if (data.players) {
          Object.keys(data.players).forEach(username => {
            const player = data.players[username];
            const row = document.createElement('tr');
            
            row.innerHTML = `
              <td>${username}</td>
              <td>
                <div class="tier-badge">
                  <span class="ht ${getTierClass(player.tier)}">${player.tier}</span>
                </div>
              </td>
              <td>${player.color}</td>
              <td>${player.displayName}</td>
              <td>
                <button class="delete-btn" onclick="deletePlayer('${username}')">Delete</button>
              </td>
            `;
            tbody.appendChild(row);
          });
        }
      } catch (error) {
        console.error('Error loading tiers:', error);
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #6a6a80;">Error loading tiers</td></tr>';
      }
    }
    
    // Delete player
    async function deletePlayer(username) {
      if (confirm(`Delete ${username}?`)) {
        try {
          const response = await fetch(`/api/tiers/${username}`, {
            method: 'DELETE'
          });
          
          const result = await response.json();
          if (result.success) {
            showModal('Success', result.message);
            loadTiers();
          } else {
            showModal('Error', result.error);
          }
        } catch (error) {
          showModal('Error', error.message);
        }
      }
    }
  </script>
</body>
</html>
